<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1217">
<title>Speed Lab – Golf Schwunggeschwindigkeit</title>
<style>
:root{
  --bg:#0e1217;--card:#171d25;--card2:#1e2630;--text:#e9eef3;--muted:#8d99a6;--line:#2a3541;
  --accent:#27c3b0;--danger:#ef5b5b;--ok:#5fd38d;--warn:#f2b84b;
  --c-stack:#f5c400;--c-pure:#ef4a4f;--c-driver:#6ea6ff;--c-all:#27c3b0;
  --shadow:0 2px 12px rgba(0,0,0,.35);--solid:var(--card);--on-accent:#06211d;
}
:root[data-theme="light"]{
  --bg:#eef1f4;--card:#ffffff;--card2:#f3f5f8;--text:#18212b;--muted:#667380;--line:#dde3e9;
  --accent:#0b9c8a;--danger:#d63c3c;--ok:#1f9d55;--warn:#b7791f;
  --c-stack:#c99a00;--c-pure:#d62828;--c-driver:#2563eb;--c-all:#0b9c8a;--shadow:0 1px 6px rgba(20,30,40,.12);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef1f4;--card:#ffffff;--card2:#f3f5f8;--text:#18212b;--muted:#667380;--line:#dde3e9;
    --accent:#0b9c8a;--danger:#d63c3c;--ok:#1f9d55;--warn:#b7791f;
    --c-stack:#c99a00;--c-pure:#d62828;--c-driver:#2563eb;--c-all:#0b9c8a;--shadow:0 1px 6px rgba(20,30,40,.12);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:1.5rem}h2{font-size:1.05rem}h3{font-size:.95rem}
.muted{color:var(--muted)}.small{font-size:.82rem}.tiny{font-size:.74rem}
.num{font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
#nav{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-weight:800;font-size:1.05rem}
.brand .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#4cc9f0);display:grid;place-items:center;color:#07211e;font-size:18px}
#nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:600}
#nav a .ic{width:22px;text-align:center;font-size:1.05rem}
#nav a:hover{background:var(--card2);color:var(--text)}
#nav a.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.navfoot{margin-top:auto;padding:10px;font-size:.78rem;color:var(--muted)}
#view{padding:22px clamp(14px,3vw,34px) 60px;max-width:1280px;width:100%}
body.compact #view{max-width:520px;margin:0 auto;padding-top:14px}
body.compact h1{font-size:1.25rem}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card>.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card>.ch .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.big{font-size:2.5rem;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.big small{font-size:1rem;font-weight:600;color:var(--muted);margin-left:4px}
.eq{color:var(--muted);font-size:.8em;font-weight:600}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:.85rem;padding:2px 8px;border-radius:99px}
.delta.up{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.delta.down{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.delta.flat{background:var(--card2);color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:9px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--danger)}
.btn.lg{padding:14px 22px;font-size:1.05rem;border-radius:14px}
.btn.sm{padding:5px 10px;font-size:.82rem;border-radius:8px}
.btn.ghost{background:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 11px;font-size:.8rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--accent)}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.74rem;font-weight:700;background:var(--card2);color:var(--muted)}
.sd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}

/* Geräte-Farbschemata: Stack gelb/schwarz · Pure2 weiß/rot · Driver grau/blau */
.dv{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:2px 9px;font-weight:700;font-size:.8rem;white-space:nowrap}
.dv.stack{background:#f5c400;color:#14130f}
.dv.pure{background:#ffffff;color:#c1121f;box-shadow:inset 0 0 0 1.5px #c1121f}
.dv.driver{background:#9ca3af;color:#1b3a9c}
.dvpick{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dvpick button{border:2px solid transparent;border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;opacity:.45}
.dvpick button.on{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 35%,transparent)}
.dvpick button.stack{background:#f5c400;color:#14130f}
.dvpick button.pure{background:#fff;color:#c1121f;border-color:#c1121f}
.dvpick button.driver{background:#9ca3af;color:#1b3a9c}

.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.stack-v{display:flex;flex-direction:column;gap:10px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.hr{height:1px;background:var(--line);margin:12px 0}
.ringwrap{display:flex;align-items:center;gap:14px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:.78rem;box-shadow:var(--shadow);white-space:nowrap;transform:translate(-50%,-110%);z-index:5;display:none}
.axis text{fill:var(--muted);font-size:11px}
.grid-line{stroke:var(--line);stroke-width:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--card2);display:block;min-width:9px}
.heat i.l1{background:color-mix(in srgb,var(--accent) 35%,var(--card2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 65%,var(--card2))}
.heat i.l3{background:var(--accent)}
.heat i.today{outline:1.5px solid var(--text)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:0}
table.t .r{text-align:right}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line)}
.badge .bi{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:1.5rem;background:color-mix(in srgb,var(--warn) 22%,transparent)}
.badge.locked{opacity:.5;filter:grayscale(1)}
.quest{display:grid;gap:5px}
.sess{display:grid;gap:8px}
.setline{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pbtag{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn);border-radius:6px;padding:1px 7px;font-size:.74rem;font-weight:800}
.field{display:grid;gap:4px}
.field label{font-size:.78rem;color:var(--muted);font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=range]{width:100%;accent-color:var(--accent)}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

/* Runner */
.runner{max-width:640px;margin:0 auto}
.runner .stepcard{padding:20px;text-align:center}
.bigstick{font-size:1.6rem;font-weight:800}
.swgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;margin:12px 0}
.swcell{background:var(--card2);border-radius:12px;padding:8px 6px 6px;border:1px solid var(--line)}
.swcell .n{font-size:.68rem;color:var(--muted)}
.swcell input{text-align:center;font-size:1.35rem;font-weight:800;padding:6px 2px!important;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0}
.swcell .es{font-size:.74rem;color:var(--muted);opacity:.85;min-height:1.1em;font-variant-numeric:tabular-nums}
.timer{font-size:5rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.checklist{text-align:left;display:grid;gap:8px;margin:14px 0}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:10px;background:var(--card2);cursor:pointer}
.checklist input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent)}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
#modal.open{display:flex}
.sheet{background:var(--solid);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(760px,100%);box-shadow:0 20px 70px rgba(0,0,0,.5)}
#toasts{position:fixed;right:14px;bottom:14px;display:grid;gap:8px;z-index:70}
.toast{background:var(--solid);border:1px solid var(--accent);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);animation:pop .3s}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
.note{border-left:3px solid var(--accent);padding:8px 12px;background:var(--card2);border-radius:0 10px 10px 0;font-size:.88rem}
.note.warn{border-color:var(--warn)}.note.bad{border-color:var(--danger)}
details.sci summary{cursor:pointer;font-weight:700}
details.sci ul{margin:8px 0 0;padding-left:20px;display:grid;gap:5px}
.setrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end;padding:10px;border-radius:12px;background:var(--card2)}
.setrow .wide{grid-column:1/-2}

/* ---------- Aurora (dunkel, Glas – wie im Garmin-Dashboard) ---------- */
html[data-theme="aurora"]{
  --bg:#0a0e1f;--card:rgba(255,255,255,.075);--card2:rgba(255,255,255,.08);--solid:#1a2040;
  --text:#f4f6ff;--muted:#bcc3e6;--line:rgba(255,255,255,.16);--accent:#a9b5ff;--on-accent:#0a0e1f;
  --ok:#6ff0a6;--warn:#ffd966;--danger:#ffa59f;
  --c-stack:#ffd23f;--c-pure:#ff7b7b;--c-driver:#9db9ff;--c-all:#2fd9d0;
  --shadow:0 20px 50px rgba(0,0,0,.28);color-scheme:dark;
}
html[data-theme="aurora"] body{
  background:
    radial-gradient(900px 500px at 6% -5%,rgba(108,123,255,.50),transparent 60%),
    radial-gradient(800px 520px at 100% 4%,rgba(255,107,107,.34),transparent 60%),
    radial-gradient(900px 600px at 70% 100%,rgba(25,200,192,.30),transparent 60%),#0a0e1f;
  background-attachment:fixed;
}
html[data-theme="aurora"] .card,html[data-theme="aurora"] #nav{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
html[data-theme="aurora"] #nav{background:rgba(14,18,40,.72)}
html[data-theme="aurora"] .card{background:radial-gradient(170px 140px at 100% 0%,color-mix(in srgb,var(--glow,#6c7bff) 34%,transparent),transparent 72%),var(--card)}
html[data-theme="aurora"] .grid>.card:nth-child(4n+1),html[data-theme="aurora"] .stack-v>.card:nth-child(4n+1){--glow:#2fd9d0}
html[data-theme="aurora"] .grid>.card:nth-child(4n+2),html[data-theme="aurora"] .stack-v>.card:nth-child(4n+2){--glow:#ffd23f}
html[data-theme="aurora"] .grid>.card:nth-child(4n+3),html[data-theme="aurora"] .stack-v>.card:nth-child(4n+3){--glow:#b794ff}
html[data-theme="aurora"] .grid>.card:nth-child(4n+4),html[data-theme="aurora"] .stack-v>.card:nth-child(4n+4){--glow:#ff7b7b}
html[data-theme="aurora"] .brand .logo{background:linear-gradient(135deg,#ff7b7b,#6c7bff);color:#fff}
html[data-theme="aurora"] #nav a.on{background:color-mix(in srgb,var(--accent) 22%,transparent)}
html[data-theme="aurora"] .note{background:rgba(255,255,255,.07)}
html[data-theme="aurora"] .delta.up{color:#6ff0a6}
html[data-theme="aurora"] body.compact #nav,html[data-theme="aurora"] #nav{border-color:rgba(255,255,255,.16)}
@media (max-width:760px){html[data-theme="aurora"] #nav{background:rgba(14,18,40,.86)}}
html[data-theme="aurora"] body.compact #nav{background:rgba(14,18,40,.86)}

@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  #app{grid-template-columns:1fr}
  #nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:40;gap:0}
  #nav .brand,#nav .navfoot{display:none}
  #nav a{flex-direction:column;gap:2px;padding:6px 2px;font-size:.62rem;flex:1;text-align:center;align-items:center}
  #view{padding-bottom:96px}
  .g2,.g4{grid-template-columns:minmax(0,1fr)}
  .g4.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .big{font-size:2.1rem}
  #toasts{bottom:78px}
  .setrow{grid-template-columns:repeat(2,minmax(0,1fr)) auto}
}
body.compact #nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:40;gap:0}
body.compact #nav .brand,body.compact #nav .navfoot{display:none}
body.compact #nav a{flex-direction:column;gap:2px;padding:6px 2px;font-size:.62rem;flex:1;text-align:center;align-items:center}
body.compact #app{grid-template-columns:1fr}
body.compact #view{padding-bottom:96px}
body.compact .g2,body.compact .g3,body.compact .g4,body.compact .g21{grid-template-columns:minmax(0,1fr)}
body.compact .g4.keep2,body.compact .g2.keep2{grid-template-columns:repeat(2,minmax(0,1fr))}
body.compact #toasts{bottom:78px}
</style>
</head>
<body>
<div id="app">
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="toasts"></div>
<canvas id="confetti"></canvas>

<script>
'use strict';
/* =========================================================
   Speed Lab – Golf Schwunggeschwindigkeit  (v2)
   Geräte: Stack (gelb/schwarz), Pure2 (weiß/rot), Driver (grau/blau)
   Radar-Rohwert pro Swing + berechneter Driver-Äquivalent-Speed (eSpeed).
   Intern km/h, Anzeige standardmäßig mph.  Daten: localStorage.
   ========================================================= */
const KEY='speedlab.v2';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- Datum ---------- */
const ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const parseD=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const weekStart=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
const diffDays=(a,b)=>Math.round((parseD(a)-parseD(b))/864e5);
const today=()=>ymd(new Date());
const DOW=['Mo','Di','Mi','Do','Fr','Sa','So'];
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const fmtDate=s=>{const d=parseD(s);return `${DOW[(d.getDay()+6)%7]}, ${d.getDate()}. ${MON[d.getMonth()]} ${d.getFullYear()}`};
const fmtShort=s=>{const d=parseD(s);return `${d.getDate()}. ${MON[d.getMonth()]}`};

/* ---------- Geräte & Stufen ---------- */
const DEV={
  stack:{name:'Stack',sub:'gelb/schwarz',color:'var(--c-stack)'},
  pure:{name:'Pure2',sub:'weiß/rot',color:'var(--c-pure)'},
  driver:{name:'Driver',sub:'grau/blau',color:'var(--c-driver)'}
};
const DEVS=Object.keys(DEV);
const LV={L:'Leicht',M:'Mittel',H:'Schwer',D:'Driver'};
const PURE_COL=['Silber','Rot','Schwarz'];

/* Standardwerte (Quellen: Hersteller-/Händlerangaben, teils Schätzung – in den Einstellungen anpassbar)
   Stack: 5 Gewichte 20/45/60/75/100 g (30 Kombinationen, 0–300 g), Länge 41,5", Leergewicht ≈ 200 g (Forum, ungefähr)
   Pure2: Gewichte 120/151/185 g (Silber/Weiß=120, Rot=151, Schwarz=185); Länge & Leergewicht geschätzt            */
const defaults=()=>{
  const d={v:2,
    settings:{name:'',unit:'mph',goal:null,weekly:3,programStart:today(),theme:'aurora',themeV:2,view:'auto',rest:40,swings:5,transfer:true,sound:true,device:'stack',
      equip:{
        stack:{len:41.5,m0:200,cg:.5,wp:.95,weights:[20,45,60,75,100]},
        pure:{len:42,m0:160,cg:.5,wp:.95,weights:[120,151,185]},
        driver:{len:45.75,moi:2900}
      },
      model:{k:.25,cal:1},
      loads:{stack:{L:0,M:0,H:0},pure:{L:120,M:151,H:185}}},
    sessions:[],badges:{},questsDone:{},deleted:{},settingsMod:0};
  const prev=S;S=d;                              // Standardlasten brauchen die Modellformeln
  try{for(const [lv,r] of [['L',.75],['M',1],['H',1.25]])d.settings.loads.stack[lv]=nearestLoad('stack',r)}finally{S=prev}
  return d;
};
let S=null;
function mergeState(o){
  const d=defaults();
  const s={...d,...o,settings:{...d.settings,...(o.settings||{})}};
  s.settings.equip={stack:{...d.settings.equip.stack,...((o.settings||{}).equip||{}).stack},pure:{...d.settings.equip.pure,...((o.settings||{}).equip||{}).pure},driver:{...d.settings.equip.driver,...((o.settings||{}).equip||{}).driver}};
  if(!s.settings.themeV){s.settings.theme='aurora';s.settings.themeV=2}   // Aurora als neues Standarddesign
  const dv=s.settings.equip.driver;if(dv.len===45.5&&dv.moi===2800){dv.len=45.75;dv.moi=2900}   // alte Standardwerte → TaylorMade Qi10 (45,75″, D4)
  s.settings.model={...d.settings.model,...(o.settings||{}).model};
  const ol=(o.settings||{}).loads||{};
  s.settings.loads={stack:{...d.settings.loads.stack,...ol.stack},pure:{...d.settings.loads.pure,...ol.pure}};
  return s;
}
function load(){

/* ---------- Einheiten ---------- */
const MPH=1.609344;
const U=()=>S.settings.unit;
const uLabel=()=>U()==='mph'?'mph':'km/h';
const toU=k=>U()==='mph'?k/MPH:k;
const fromU=v=>U()==='mph'?v*MPH:v;
const fmt=(k,d=1)=>k==null||isNaN(k)||k===0?'–':toU(k).toFixed(d);
const fmtSigned=(k,d=1)=>{const v=toU(k);return (v>0?'+':v<0?'−':'±')+Math.abs(v).toFixed(d)};

/* ---------- Physik-Modell: eSpeed ----------
   Trägheitsmoment um das Griffende:  I = m0·(cg·L)² + w·(wp·L)²   (Gewichte am Kopfende)
   Annahme: gleiche „Kraftabgabe“ → Winkelgeschwindigkeit ω ∝ I^(-k)  (k≈0,25 Schätzung; 0,5 = gleiche Energie)
   eSpeed = v_radar · (L_driver / L_gerät) · (I_gerät / I_driver)^k · Kalibrierfaktor                           */
const IN=0.0254;
const eqp=dev=>S.settings.equip[dev];
function inertia(dev,w){
  const e=eqp(dev);if(dev==='driver')return e.moi/1e4;
  const L=e.len*IN;return (e.m0/1000)*(e.cg*L)**2+(w/1000)*(e.wp*L)**2;
}
function eFactor(dev,w,cal=true){
  if(dev==='driver')return 1;
  const d=eqp('driver'),s=eqp(dev);
  return (d.len/s.len)*Math.pow(inertia(dev,w)/inertia('driver',0),S.settings.model.k)*(cal?S.settings.model.cal:1);
}
const eSpeed=(dev,w,v)=>v*eFactor(dev,w);
const inertiaRatio=(dev,w)=>inertia(dev,w)/inertia('driver',0);
function loadOptions(dev){
  if(dev==='driver')return [{w:0,combo:[]}];
  const ws=eqp(dev).weights;
  if(dev==='pure')return ws.map(w=>({w,combo:[w]}));
  const best=new Map();
  for(let m=0;m<(1<<ws.length);m++){
    const combo=ws.filter((_,i)=>m&(1<<i)),sum=combo.reduce((a,b)=>a+b,0);
    if(!best.has(sum)||best.get(sum).length>combo.length)best.set(sum,combo);
  }
  return [...best].map(([w,combo])=>({w,combo})).sort((a,b)=>a.w-b.w);
}
function nearestLoad(dev,ratio){
  const e=eqp(dev),L=e.len*IN,target=ratio*inertia('driver',0);
  const w=(target-(e.m0/1000)*(e.cg*L)**2)/((e.wp*L)**2)*1000;
  return loadOptions(dev).reduce((a,b)=>Math.abs(b.w-w)<Math.abs(a.w-w)?b:a).w;
}
function comboOf(dev,w){const o=loadOptions(dev).find(x=>x.w===w);return o&&o.combo.length>1?` (${o.combo.join('+')})`:''}
function loadLabel(dev,lv,w){
  if(dev==='driver')return 'Driver';
  if(dev==='pure'){const i=eqp('pure').weights.indexOf(w);return `${PURE_COL[i]||'–'} ${w} g`}
  return `${w} g${comboOf('stack',w)}`;
}
const loadFor=(dev,lv)=>dev==='driver'?0:S.settings.loads[dev][lv]||0;
const dvChip=(dev,txt)=>`<span class="dv ${dev}">${txt??DEV[dev].name}</span>`;

  return {dev:x.dev,lvl:x.lvl,w:x.w||0,side:x.side||'normal',swings:Math.max(+x.swings||0,v.length),v,
    max:v.length?Math.max(...v):(x.max||0),avg:v.length?v.reduce((a,b)=>a+b,0)/v.length:(x.avg||0)};
}
const emaxOf=x=>x.max*eFactor(x.dev,x.w);
const swingsOf=s=>s.sets.reduce((a,b)=>a+(+b.swings||0),0);

/* ---------- Programm ---------- */
const KINDS={
  speed:{name:'Speed-Tag',desc:'Fokus Überschnelligkeit (viele leichte Sätze)',L:3,M:2,H:1},
  power:{name:'Power-Tag',desc:'Fokus Kraft & Beschleunigung (mehr schwere Sätze)',L:2,M:2,H:2},
  mix:{name:'Mix-Tag',desc:'Ausgewogen, mittleres Volumen',L:2,M:2,H:1}
};
const KIND_ORDER=['speed','power','mix'];
const WEEKS=[
  {name:'Einführung',mul:.67,tip:'Technik & Gewöhnung. Volle Absicht, aber noch nicht ans Limit gehen.'},
  {name:'Aufbau',mul:1,tip:'Volles Standardvolumen. Qualität vor Quantität.'},
  {name:'Peak',mul:1.33,tip:'Höchstes Volumen im Block – auf Erholung & Schlaf achten.'},
  {name:'Deload / Test',mul:.5,tip:'Reduziertes Volumen. Am Ende Speed-Test durchführen.'}
];
function programPos(d=today()){
  const days=diffDays(d,S.settings.programStart);
  if(days<0)return {block:0,week:0,abs:0,pre:true};
  const w=Math.floor(days/7);return {block:Math.floor(w/4)+1,week:w%4,abs:w};
}
function mkSet(dev,lv,side,swings){
  return dev==='driver'?{dev,lvl:'D',plan:lv,w:0,side,swings}:{dev,lvl:lv,plan:lv,w:loadFor(dev,lv),side,swings};
}
function planFor(kind,week,dev=S.settings.device){
  const k=KINDS[kind],sets=[];
  for(const lv of ['L','M','H']){
    const n=Math.max(1,Math.round(k[lv]*WEEKS[week].mul));
    for(let i=0;i<n;i++)sets.push(mkSet(dev,lv,i%2?'gegen':'normal',S.settings.swings));
  }
  return sets;
}
const sideName=s=>s==='gegen'?'Gegenseite (schwache Seite)':'Normale Seite';

function suggestedKind(){

  return KIND_ORDER[n%3];
}
function estMinutes(sets){return Math.round((sets.length*(S.settings.swings*5+S.settings.rest)+300)/60)}

/* ---------- Auswertung ---------- */
function allSets(){
  const out=[];
  for(const s of S.sessions)for(const x of s.sets)if(x.max>0)out.push({...x,date:s.date,t:+parseD(s.date),sid:s.id,type:s.type,emax:emaxOf(x)});
  return out;
}
/* key: 'all' | 'stack' | 'pure' | 'driver';  basis: 'e' (eSpeed) | 'raw' (Radar) */
function dailyBest(key,basis='e',sets=allSets()){
  const m=new Map();
  for(const x of sets){if(key!=='all'&&x.dev!==key)continue;
    const v=basis==='e'?x.emax:x.max;m.set(x.date,Math.max(m.get(x.date)||0,v))}
  return [...m].map(([date,v])=>({date,t:+parseD(date),v})).sort((a,b)=>a.t-b.t);
}
function regress(pts){
  if(pts.length<3)return null;
  const x0=pts[0].t,xs=pts.map(p=>(p.t-x0)/864e5),ys=pts.map(p=>p.v),n=pts.length;
  const mx=xs.reduce((a,b)=>a+b)/n,my=ys.reduce((a,b)=>a+b)/n;
  let sxx=0,sxy=0;for(let i=0;i<n;i++){sxx+=(xs[i]-mx)**2;sxy+=(xs[i]-mx)*(ys[i]-my)}
  if(!sxx)return null;const slope=sxy/sxx;return {slope,icpt:my-slope*mx,x0};
}
function movAvg(pts,k=3){return pts.map((p,i)=>{const sl=pts.slice(Math.max(0,i-k+1),i+1);return {...p,v:sl.reduce((a,b)=>a+b.v,0)/sl.length}})}
function rangeFilter(pts,r){
  if(r==='ALL')return pts;const days={W4:28,W12:84,Y:365}[r]||84,cut=addDays(today(),-days);
  return pts.filter(p=>p.date>=cut);
}
function eStats(){
  const d=dailyBest('all','e');if(!d.length)return null;
  const t=today(),recent=d.filter(p=>diffDays(t,p.date)<=28);
  const cur=recent.length?Math.max(...recent.map(p=>p.v)):d[d.length-1].v;
  const base=Math.max(...d.filter(p=>diffDays(p.date,d[0].date)<=14).map(p=>p.v));
  const drv=dailyBest('driver','raw');
  return {cur,base,pb:Math.max(...d.map(p=>p.v)),n:d.length,drvBest:drv.length?Math.max(...drv.map(p=>p.v)):0};
}
function weekStreaks(){
  const target=S.settings.weekly,counts=new Map();
  for(const s of S.sessions)counts.set(weekStart(s.date),(counts.get(weekStart(s.date))||0)+1);
  if(!counts.size)return {cur:0,best:0};
  const first=[...counts.keys()].sort()[0],thisW=weekStart(today());
  let best=0,run=0;
  for(let w=first;w<=thisW;w=addDays(w,7)){
    if((counts.get(w)||0)>=target){run++;best=Math.max(best,run)}else if(w!==thisW)run=0;
  }
  let cur=0;
  for(let w=thisW;w>=first;w=addDays(w,-7)){if((counts.get(w)||0)>=target)cur++;else if(w!==thisW)break}
  return {cur,best};
}
const sessionsThisWeek=()=>sessionsInWeek(weekStart(today()));

const TITLES=['Range-Rookie','Hobby-Schwinger','Clubmitglied','Single-Handicapper','Scratch-Spieler','Tour-Rookie','Tour-Pro','Major-Sieger','Hall of Famer','Legende'];
function levelInfo(xp){
  let level=1,need=400;
  while(xp>=need){xp-=need;level++;need=Math.round(need*1.2)}
  return {level,into:xp,need,title:TITLES[Math.min(TITLES.length-1,Math.floor((level-1)/3))]};
}
const totalXP=()=>S.sessions.reduce((a,s)=>a+(s.xp||0),0)+Object.keys(S.questsDone).length*60;
const pbKey=x=>x.dev==='driver'?'driver':x.dev+':'+x.w;
const pbLabel=k=>k==='E'?'eSpeed':k==='driver'?'Driver':`${DEV[k.split(':')[0]].name} ${k.split(':')[1]} g`;
function computePBs(sess){
  const prior=S.sessions.filter(s=>s.id!==sess.id&&(s.date<sess.date||(s.date===sess.date&&(s.created||0)<(sess.created||0))));
  const pbs=[],groups=new Map();
  for(const x of sess.sets)if(x.max>0){const k=pbKey(x);groups.set(k,Math.max(groups.get(k)||0,x.max))}
  for(const [k,mine] of groups){
    const before=Math.max(0,...prior.flatMap(s=>s.sets.filter(x=>pbKey(x)===k).map(x=>x.max||0)));
    if(before&&mine>before+1e-4)pbs.push({key:k,val:mine,prev:before});
  }
  const mineE=Math.max(0,...sess.sets.map(x=>x.max>0?emaxOf(x):0));
  const beforeE=Math.max(0,...prior.flatMap(s=>s.sets.map(x=>x.max>0?emaxOf(x):0)));
  if(mineE&&beforeE&&mineE>beforeE+1e-4)pbs.push({key:'E',val:mineE,prev:beforeE});
  return pbs;
}
function calcXP(sess){
  let xp=sess.type==='test'?80:100;
  xp+=swingsOf(sess);
  if(new Set(sess.sets.filter(x=>x.dev!=='driver').map(x=>x.lvl)).size>=3)xp+=40;
  xp+=(sess.pbs||[]).length*60;
  if(sess.rpe)xp+=10;
  return xp;
}

}

const niceStep=r=>{const e=Math.pow(10,Math.floor(Math.log10(r))),f=r/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e};
function niceTicks(min,max,n=5){
  if(min===max){min-=1;max+=1}
  const step=niceStep((max-min)/n),a=Math.floor(min/step)*step,out=[];
  for(let v=a;v<=max+step*.999;v+=step)out.push(+v.toFixed(6));
  return out;
}
function lineChart(el,{series,goal,H=270}){
  const W=720,m={l:44,r:14,t:14,b:28};
  const all=series.flatMap(s=>s.pts);
  if(!all.length){el.innerHTML='<div class="empty">Noch keine Messwerte im gewählten Zeitraum.</div>';return}
  let t0=Math.min(...all.map(p=>p.t)),t1=Math.max(...all.map(p=>p.t));
  if(t0===t1){t0-=864e5*3;t1+=864e5*3}else{const pd=(t1-t0)*.03;t0-=pd;t1+=pd}
  let vs=all.map(p=>toU(p.v));
  if(goal){const g=toU(goal);if(g<=Math.max(...vs)*1.08)vs.push(g)}
  const lo=Math.min(...vs),hi=Math.max(...vs),pad=(hi-lo||2)*.12;
  const ticks=niceTicks(lo-pad,hi+pad,4),ymin=ticks[0],ymax=ticks[ticks.length-1];
  const X=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r),Y=v=>m.t+(1-(toU(v)-ymin)/(ymax-ymin))*(H-m.t-m.b);
  let g='';
  for(const tk of ticks){const y=m.t+(1-(tk-ymin)/(ymax-ymin))*(H-m.t-m.b);
    g+=`<line class="grid-line" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text x="${m.l-8}" y="${y+4}" text-anchor="end">${+tk.toFixed(1)}</text>`}
  const nx=5;for(let i=0;i<nx;i++){const t=t0+(t1-t0)*i/(nx-1),d=new Date(t);
    g+=`<text x="${X(t)}" y="${H-8}" text-anchor="${i===0?'start':i===nx-1?'end':'middle'}">${d.getDate()}. ${MON[d.getMonth()]}</text>`}
  if(goal&&toU(goal)>=ymin&&toU(goal)<=ymax)
    g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(goal)}" y2="${Y(goal)}" stroke="var(--warn)" stroke-dasharray="5 4"/><text x="${W-m.r}" y="${Y(goal)-5}" text-anchor="end" fill="var(--warn)" font-size="11">Ziel ${+toU(goal).toFixed(1)}</text>`;
  const hit=[];
  for(const s of series){
    const P=s.pts.map(p=>[X(p.t),Y(p.v)]);
    if(s.trend){const r=regress(s.pts);if(r){const a=s.pts[0].t,b=s.pts[s.pts.length-1].t;
      const ya=r.icpt+r.slope*(a-r.x0)/864e5,yb=r.icpt+r.slope*(b-r.x0)/864e5;
      g+=`<line x1="${X(a)}" y1="${Y(ya)}" x2="${X(b)}" y2="${Y(yb)}" stroke="${s.color}" stroke-width="1.5" stroke-dasharray="2 5" opacity=".8"/>`}}
    if(s.ma){const mp=movAvg(s.pts,3).map(p=>`${X(p.t)},${Y(p.v)}`).join(' ');
      g+=`<polyline points="${mp}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
      g+=P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="${s.color}" opacity=".45"/>`).join('')}
    else{
      if(P.length>1)g+=`<polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round"/>`;
      g+=P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="var(--solid)" stroke="${s.color}" stroke-width="2"/>`).join('');
    }
    s.pts.forEach((p,i)=>hit.push({x:P[i][0],y:P[i][1],s:s.name,c:s.color,v:p.v,d:p.date}));
  }
  el.innerHTML=`<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" class="axis" role="img" aria-label="Liniendiagramm"><g>${g}</g><line id="gl" y1="${m.t}" y2="${H-m.b}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/></svg><div class="tip"></div></div>`;
  const svg=$('svg',el),tip=$('.tip',el),gl=$('#gl',el);
  const move=e=>{
    const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;
    let best=null,bd=1e9;for(const h of hit){const d=Math.abs(h.x-px)*1.5+Math.abs(h.y-py)*.3;if(d<bd){bd=d;best=h}}
    if(!best)return;
    tip.style.display='block';tip.style.left=(best.x/W*100)+'%';tip.style.top=(best.y/H*100)+'%';
    tip.innerHTML=`<b style="color:${best.c}">${esc(best.s)}</b><br>${fmt(best.v)} ${uLabel()} · ${fmtShort(best.d)}`;
    gl.setAttribute('x1',best.x);gl.setAttribute('x2',best.x);gl.setAttribute('opacity',.6);
  };
  svg.addEventListener('pointermove',move);svg.addEventListener('pointerdown',move);
  svg.addEventListener('pointerleave',()=>{tip.style.display='none';gl.setAttribute('opacity',0)});
}
function barChart(el,{cats,stacks,H=200,fmtV=v=>v}){
  const W=720,m={l:38,r:8,t:10,b:26};
  const tot=cats.map((_,i)=>stacks.reduce((a,s)=>a+(s.vals[i]||0),0)),mx=Math.max(1,...tot);
  const ticks=niceTicks(0,mx,3),ymax=ticks[ticks.length-1],bw=(W-m.l-m.r)/cats.length;
  let g='';
  for(const tk of ticks){const y=m.t+(1-tk/ymax)*(H-m.t-m.b);g+=`<line class="grid-line" x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}"/><text x="${m.l-6}" y="${y+4}" text-anchor="end">${tk}</text>`}
  cats.forEach((c,i)=>{
    let y=H-m.b;const x=m.l+i*bw+bw*.18;
    stacks.forEach(s=>{const v=s.vals[i]||0;if(!v)return;const h=v/ymax*(H-m.t-m.b);y-=h;
      g+=`<rect x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(h,0)}" rx="2" fill="${s.color}"><title>${esc(c)} · ${esc(s.name)}: ${fmtV(v)}</title></rect>`});
    if(cats.length<=14||i%2===0)g+=`<text x="${x+bw*.32}" y="${H-8}" text-anchor="middle">${esc(c)}</text>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" class="axis" style="width:100%;height:auto">${g}</svg>`;
}
function heatmap(weeks=20){
  const end=weekStart(today()),start=addDays(end,-7*(weeks-1)),vol=new Map();
  for(const s of S.sessions)vol.set(s.date,(vol.get(s.date)||0)+swingsOf(s));
  let h='';
  for(let i=0;i<weeks*7;i++){
    const d=addDays(start,i);if(d>today()){h+='<i style="opacity:.25"></i>';continue}
    const v=vol.get(d)||0,l=v?v<30?1:v<60?2:3:0;
    h+=`<i class="${l?'l'+l:''} ${d===today()?'today':''}" title="${fmtDate(d)}: ${v} Swings"></i>`;
  }
  return `<div class="heat" style="grid-template-columns:repeat(${weeks},1fr)">${h}</div>
  <div class="legend"><span>weniger</span><span class="heat" style="grid-template-rows:1fr;grid-auto-flow:column;gap:3px"><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i></span><span>mehr Swings</span></div>`;
}
function volChart(el,n){
  const thisW=weekStart(today()),ws=[];
  for(let i=n-1;i>=0;i--)ws.push(addDays(thisW,-7*i));
  const stacks=DEVS.map(k=>({name:DEV[k].name,color:DEV[k].color,vals:ws.map(w=>sessionsInWeek(w).reduce((a,s)=>a+s.sets.filter(x=>x.dev===k).reduce((b,x)=>b+(+x.swings||0),0),0))}));
  barChart(el,{cats:ws.map(w=>{const d=parseD(w);return `${d.getDate()}.${d.getMonth()+1}.`}),stacks,H:n<=6?170:200,fmtV:v=>v+' Swings'});
}

function confetti(){
  const cv=$('#confetti'),ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#27c3b0','#4cc9f0','#f5c400','#ef4a4f','#7ddb7a','#ffffff'];
  const ps=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,s:4+Math.random()*6,c:cols[Math.random()*6|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0;(function step(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore()});
    if(++f<150)requestAnimationFrame(step);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}
let actx;
function beep(freq=880,dur=.18){
  if(!S.settings.sound)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=freq;o.connect(g);g.connect(actx.destination);
    g.gain.setValueAtTime(.15,actx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);o.start();o.stop(actx.currentTime+dur)}catch(e){}
}

function insights(){
  const out=[],pos=programPos(),t=today();
  if(!S.sessions.length)return [{k:'',t:'Willkommen! Starte mit einem <b>Speed-Test</b> (Driver, 3 Sätze) – das ist dein Ausgangswert. Danach folgt der 4-Wochen-Block.'}];
  const last=[...S.sessions].sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0))[0];
  if(diffDays(t,last.date)<1)out.push({k:'warn',t:'Heute schon trainiert – für die Schnelligkeit zählt Erholung (≥ 24–48 h Pause).'});
  const lastTest=S.sessions.filter(s=>s.type==='test').map(s=>s.date).sort().pop();
  if(!lastTest&&S.sessions.length>=3)out.push({k:'warn',t:'Noch kein Speed-Test – ohne Testwert lässt sich der Fortschritt nicht sauber messen.'});
  else if(lastTest&&diffDays(t,lastTest)>=28)out.push({k:'warn',t:`Letzter Speed-Test vor ${diffDays(t,lastTest)} Tagen – Zeit für einen neuen.`});
  if(!pos.pre&&pos.week===3)out.push({k:'',t:'<b>Deload-Woche:</b> Volumen halbiert. Nutze sie zur Erholung und beende sie mit einem Speed-Test.'});
  if(S.sessions.filter(s=>s.pain&&diffDays(t,s.date)<=14).length)out.push({k:'bad',t:'Beschwerden in den letzten 14 Tagen gemeldet: Intensität/Volumen reduzieren, ggf. abklären lassen.'});
  const d=dailyBest('all','e');
  if(d.length>=4){
    const r=regress(rangeFilter(d,'W12'));
    if(r){const per30=r.slope*30;out.push({k:per30>0.05?'':'warn',t:per30>0.05?`Trend (12 Wo.): <b>${fmtSigned(per30)} ${uLabel()}</b> eSpeed pro 30 Tage.`:'eSpeed stagniert. Prüfe Schlaf, Lasten und ergänze Kraft/Mobilität.'})}
  }
  const q=weeklyQuests()[0];
  if(q.cur<q.max){const dl=diffDays(addDays(weekStart(t),6),t)+1;out.push({k:'',t:`Wochenziel: noch <b>${q.max-q.cur}</b> Einheit${q.max-q.cur>1?'en':''} in ${dl} Tag${dl>1?'en':''}.`})}
  return out.slice(0,isCompact()?2:4);
}

function startRun(kind){
  const pos=programPos(),dev=S.settings.device,steps=[{t:'warm'}];
  if(kind==='test'){for(let i=0;i<3;i++)steps.push({t:'set',...mkSet('driver','M','normal',5),test:true})}
  else{planFor(kind,pos.week,dev).forEach(s=>steps.push({t:'set',...s}));if(S.settings.transfer&&dev!=='driver')steps.push({t:'set',...mkSet('driver','M','normal',3),transfer:true})}
  steps.push({t:'finish'});

  try{navigator.wakeLock?.request('screen').then(l=>G.lock=l).catch(()=>{})}catch(e){}

}
function stopRun(){clearInterval(G?.timer);try{G?.lock?.release()}catch(e){};G=null}

function advance(){

function setSetting(path,val){
  const s=S.settings;if(!['view','theme'].includes(path))S.settingsMod=Date.now();
  if(path==='goal'){s.goal=val?+val:null;persist();return}
  if(path==='unit'){if(s.goal){const k=fromU(s.goal);s.unit=val;s.goal=+toU(k).toFixed(1)}else s.unit=val;persist();render();return}
  if(path.startsWith('pureW.')){const i=+path.split('.')[1],o=s.equip.pure.weights.slice();const old=o[i];o[i]=+val||old;
    ['L','M','H'].forEach((lv,j)=>{if(s.loads.pure[lv]===old&&j===i)s.loads.pure[lv]=o[i]});s.equip.pure.weights=o;
    ['L','M','H'].forEach((lv,j)=>s.loads.pure[lv]=o[j]);persist();render();return}
  if(path.startsWith('loads.')){const [,dev,lv]=path.split('.');s.loads[dev][lv]=+val;persist();render();return}
  if(path==='equip.stack.weights'){const ws=String(val).split(/[,;\s]+/).map(Number).filter(n=>n>0).slice(0,8);if(ws.length){s.equip.stack.weights=ws;
    ['L','M','H'].forEach(lv=>{s.loads.stack[lv]=nearestLoad('stack',{L:.75,M:1,H:1.25}[lv])})}persist();render();return}
  if(path.startsWith('equip.')||path.startsWith('model.')){const p=path.split('.');const tgt=p[0]==='equip'?s.equip[p[1]]:s.model;const key=p[p.length-1];const n=parseFloat(val);if(n>0)tgt[key]=n;persist();render();return}
  if(['weekly','swings','rest'].includes(path))s[path]=+val;else s[path]=val;
  if(path==='theme')applyTheme();
  persist();
  if(['weekly','programStart','view','swings','rest'].includes(path))render();
}

function csv(){
  const rows=[['Datum','Art','Geraet','Stufe','Gewicht_g','Seite','Swing_Nr','Radar_mph','eSpeed_mph','Radar_kmh','eSpeed_kmh','RPE','Notiz']];
  [...S.sessions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s=>s.sets.forEach(x=>(x.v&&x.v.length?x.v:[x.max]).forEach((v,i)=>{
    const f=eFactor(x.dev,x.w);rows.push([s.date,s.type,DEV[x.dev].name,x.lvl,x.w,x.side,i+1,(v/MPH).toFixed(1),(v*f/MPH).toFixed(1),v.toFixed(1),(v*f).toFixed(1),s.rpe||'',(s.note||'').replace(/"/g,'""')])})));

function calibrate(){
  const ratios=[];
  for(const s of S.sessions){
    const d=s.sets.filter(x=>x.dev==='driver'&&x.max>0).map(x=>x.max),o=s.sets.filter(x=>x.dev!=='driver'&&x.max>0).map(x=>x.max*eFactor(x.dev,x.w,false));
    if(d.length&&o.length)ratios.push(Math.max(...d)/Math.max(...o));
  }
  if(ratios.length<2){toast('Für die Kalibrierung braucht es mindestens 2 Einheiten mit Driver- und Stack/Pure2-Sätzen.');return}
  ratios.sort((a,b)=>a-b);const med=ratios[Math.floor(ratios.length/2)];
  S.settings.model.cal=+Math.max(.8,Math.min(1.2,med)).toFixed(3);S.settingsMod=Date.now();persist();render();
  toast(`Kalibrierfaktor gesetzt: <b>${S.settings.model.cal}</b> (aus ${ratios.length} Einheiten)`);
}
function demoData(){
  if(S.sessions.length&&!confirm('Demodaten zu den vorhandenen Daten hinzufügen?'))return;
  const start=addDays(today(),-84);S.settings.programStart=start;if(!S.settings.goal)S.settings.goal=+toU(176).toFixed(1);
  let n=0;const r=(a,b)=>a+Math.random()*(b-a);
  const mkSwings=(dev,w,target,cnt)=>{const f=eFactor(dev,w);return Array.from({length:cnt},()=>+(((target-r(0,5))/f)).toFixed(2))};
  for(let w=0;w<12;w++){
    [0,2,4].forEach((dd,ix)=>{
      const day=addDays(weekStart(addDays(start,w*7)),dd);
      if(day>today()||Math.random()<.12)return;
      const wk=w%4,kind=KIND_ORDER[ix%3],base=153+w*.8+r(-1,1);
      const dev=(w+ix)%4===3?'pure':'stack';
      const isTest=(wk===3&&ix===2)||(w===0&&ix===0);
      let sets=[];
      if(isTest)sets=[0,1,2].map(()=>({dev:'driver',lvl:'D',w:0,side:'normal',swings:5,v:mkSwings('driver',0,base,5)}));
      else{
        sets=planFor(kind,wk,dev).map(p=>{const f={L:1.03,M:1,H:.96}[p.plan];return {dev,lvl:p.lvl,w:p.w,side:p.side,swings:p.swings,v:mkSwings(dev,p.w,base*f+r(-1,1.5),p.swings)}});
        sets.push({dev:'driver',lvl:'D',w:0,side:'normal',swings:3,v:mkSwings('driver',0,base-1+r(-1.5,1.5),3)});
      }
      const sess={id:uid()+n++,created:+parseD(day)+n,date:day,type:isTest?'test':'training',kind,sets:sets.map(normSet),rpe:Math.round(r(5,8)),note:'',pain:false,demo:true};
      S.sessions.push(sess);
    });
  }
  S.sessions.sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);
  S.sessions.forEach(s=>{s.pbs=computePBs(s);s.xp=calcXP(s)});
  checkBadges(true);for(let w=weekStart(start);w<weekStart(today());w=addDays(w,7))checkQuests(w);
  persist();toast('Demodaten geladen ✔');render();
}

function canon(o){
  const st={...o.settings};delete st.view;delete st.theme;
  return stable({s:[...(o.sessions||[])].sort((a,b)=>a.id<b.id?-1:1),st,b:o.badges||{},q:o.questsDone||{},d:o.deleted||{},m:o.settingsMod||0});
}
function mergeData(a,b){
  if(!b||!b.sessions)return a;
  const del={};for(const o of [a.deleted,b.deleted])for(const k in (o||{}))del[k]=Math.max(del[k]||0,o[k]);
  const map=new Map();
  for(const s of [...b.sessions,...a.sessions]){const p=map.get(s.id);if(!p||(s.mod||0)>=(p.mod||0))map.set(s.id,s)}
  const sessions=[...map.values()].filter(s=>!(del[s.id]>(s.mod||0))).sort((x,y)=>x.date.localeCompare(y.date)||(x.created||0)-(y.created||0));
  const badges={...b.badges};for(const k in (a.badges||{}))badges[k]=!badges[k]||a.badges[k]<badges[k]?a.badges[k]:badges[k];
  const newer=(a.settingsMod||0)>=(b.settingsMod||0)?a:b;
  const settings={...newer.settings,view:a.settings.view,theme:a.settings.theme};
  return {...a,settings,sessions,badges,questsDone:{...b.questsDone,...a.questsDone},deleted:del,settingsMod:Math.max(a.settingsMod||0,b.settingsMod||0)};
}
function applyState(m){
  S=mergeState(m);window.S=S;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  applyTheme();checkBadges(true);
  if(!G&&!$('#modal').classList.contains('open')&&document.activeElement?.tagName!=='INPUT')render();
}
async function doSync(force=false){
  if(!syncOn())return;
  if(syncing){syncAgain=true;return}
  syncing=true;setSyncState('busy');
  try{
    const local=JSON.parse(JSON.stringify(S));
    if(force){await rpc('speedlab_put',{p_code:sync.code,p_data:local})}
    else{
      const remote=await rpc('speedlab_get',{p_code:sync.code});
      const merged=mergeData(local,remote);
      const mj=canon(merged);
      if(mj!==canon(local))applyState(merged);
      if(!remote||mj!==canon(remote))await rpc('speedlab_put',{p_code:sync.code,p_data:merged});
    }
    setSyncState('ok');
  }catch(e){setSyncState('err',e.message)}
  finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync()}}
}
function scheduleSync(){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>doSync(),1500)}
function applyCfgFromHash(){
  const m=location.hash.match(/cfg=([^&]+)/);if(!m)return;
  try{const o=JSON.parse(atob(decodeURIComponent(m[1])));if(o.u&&o.k&&o.c){sync={url:o.u,key:o.k,code:o.c};saveSync();setTimeout(()=>toast('Sync-Verbindung übernommen ✔'),300)}}catch(e){}
  history.replaceState(null,'',location.pathname+'#/set');
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)doSync()});
setInterval(()=>{if(!document.hidden&&!G)doSync()},90000);

/* =========================================================
   Router & Events
   ========================================================= */
const NAV=[['dash','🏠','Übersicht'],['train','🏌️','Training'],['hist','📒','Verlauf'],['ana','📊','Auswertung'],['ach','🏆','Erfolge'],['set','⚙️','Einstellungen']];
const PAGES={dash:pageDash,train:pageTrain,hist:pageHist,ana:pageAna,ach:pageAch,set:pageSet};
const AFTER={dash:afterDash,ana:afterAna};
const route=()=>(location.hash.replace(/^#\/?/,'')||'dash').split('?')[0];
function render(){
  const r=PAGES[route()]?route():'dash';
  document.body.classList.toggle('compact',isCompact());
  $('#nav').innerHTML=`<div class="brand"><div class="logo">⛳</div>Speed Lab</div>`+NAV.map(([k,i,l])=>`<a href="#/${k}" class="${k===r?'on':''}"><span class="ic">${i}</span>${isCompact()&&k==='set'?'Mehr':l}</a>`).join('')+`<div class="navfoot">${syncOn()?'Zentral synchronisiert':'Daten nur lokal'}<br>${uLabel()} · v2</div>`;
  const y=scrollY;
  $('#view').innerHTML=PAGES[r]();
  AFTER[r]?.();
  if(G&&r==='train')updateSwingStats();
  scrollTo(0,y);
}
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.settings.view==='auto'&&!G&&document.body.classList.contains('compact')!==isCompact())render()},200)});

const A={
  range(el){ui.range=el.dataset.v;render()},
  basis(el){ui.basis=el.dataset.v;if(ui.basis==='raw')ui.metric=ui.metric.filter(x=>x!=='all');if(!ui.metric.length)ui.metric=[ui.basis==='raw'?'driver':'all'];render()},
  metric(el){const v=el.dataset.v,i=ui.metric.indexOf(v);if(i>=0){if(ui.metric.length>1)ui.metric.splice(i,1)}else ui.metric.push(v);render()},
  anarange(el){ui.anaRange=el.dataset.v;render()},
  anabasis(el){ui.anaBasis=el.dataset.v;if(!ui.anaMetric.filter(x=>ui.anaBasis==='e'||x!=='all').length)ui.anaMetric=['driver'];render()},
  anametric(el){const v=el.dataset.v,i=ui.anaMetric.indexOf(v);if(i>=0){if(ui.anaMetric.length>1)ui.anaMetric.splice(i,1)}else ui.anaMetric.push(v);render()},
  anamode(el){ui.anaMode=el.dataset.v;render()},
  hfilter(el){ui.histFilter=el.dataset.v;render()},
  toggleView(){S.settings.view=isCompact()?'full':'compact';persist();render()},
  manual(){editorSheet()},
  edit(el){editorSheet(S.sessions.find(s=>s.id===el.dataset.id))},
  del(el){if(confirm('Diese Einheit wirklich löschen?')){S.deleted[el.dataset.id]=Date.now();S.sessions=S.sessions.filter(s=>s.id!==el.dataset.id);persist();render()}},
  closeModal(){closeModal()},
  addrow(){$('#e-rows').insertAdjacentHTML('beforeend',editorRow({dev:S.settings.device,lvl:'L',v:[]}))},
  rmrow(el){if($$('#e-rows .setrow').length>1)el.closest('.setrow').remove()},
  saveEdit(el){saveEditor(el.dataset.id)},
  pickdev(el){S.settings.device=el.dataset.v;S.settingsMod=Date.now();persist();render()},
  startRun(){const k=($('input[name=kind]:checked')||{}).value||suggestedKind();S.settings.transfer=$('#optTransfer').checked;persist();startRun(k)},
  startTest(){startRun('test')},
  abort(){if(confirm('Einheit abbrechen? Bisherige Sätze gehen verloren.')){stopRun();render()}},
  warmchk(el){G.warm[+el.dataset.i]=el.checked},
  next(){advance()},
  skipRest(){clearInterval(G.timer);G.resting=0;render()},
  skipSet(){advance()},
  setdev(el){const st=G.steps[G.i],dev=el.dataset.v;st.dev=dev;
    if(dev==='driver'){st.lvl='D';st.w=0}else{const lv=st.plan&&'LMH'.includes(st.plan)?st.plan:'L';st.lvl=lv;st.w=loadFor(dev,lv)}render()},
  saveSet(){
    const st=G.steps[G.i],vals=$$('.swin').map(el=>parseFloat(el.value)).filter(v=>v>0);
    if(!vals.length){toast('Bitte mindestens einen Swing eintragen – oder „Ohne Messung“ wählen.');return}
    if(vals.some(v=>toU(1)*0+v<10||v>400)){toast('Ein Wert wirkt unplausibel – bitte prüfen.');return}
    G.sets.push(normSet({dev:st.dev,lvl:st.lvl,w:st.w,side:st.side,swings:st.swings,v:vals.map(fromU)}));
    beep(740,.12);advance();
  },
  finishRun(){
    const sess={id:uid(),created:Date.now(),date:today(),type:G.kind==='test'?'test':'training',kind:G.kind==='test'?undefined:G.kind,
      sets:G.sets,rpe:+$('#rpe').value,note:$('#note').value.trim(),pain:$('#pain').checked,dur:Math.round((Date.now()-G.start)/1000)};
    if(!sess.sets.length){toast('Keine Sätze erfasst – nichts gespeichert.');stopRun();render();return}
    const res=commitSession(sess,false);stopRun();location.hash='#/dash';render();summarySheet(sess,res);
  },
  newBlock(){if(confirm('Neuen 4-Wochen-Block mit heutigem Datum starten?')){S.settings.programStart=today();S.settingsMod=Date.now();persist();render();toast('Neuer Block gestartet')}},
  calibrate(){calibrate()},
  exportJson(){download(`speedlab-backup-${today()}.json`,JSON.stringify(S,null,1),'application/json')},
  exportCsv(){download(`speedlab-swings-${today()}.csv`,csv(),'text/csv')},
  importJson(){$('#impFile').click()},
  demo(){demoData()},
  reset(){if(confirm('Wirklich ALLE Daten unwiderruflich löschen'+(syncOn()?' (auch zentral, auf allen Geräten)':'')+'?')&&confirm('Letzte Rückfrage: Alles löschen?')){
    const del={...S.deleted};S.sessions.forEach(x=>del[x.id]=Date.now());
    S=defaults();window.S=S;S.deleted=del;S.settingsMod=Date.now();persist();applyTheme();render();if(syncOn())doSync(true);toast('Alle Daten gelöscht')}},
  syncSave(){sync.url=$('#sy-url').value.trim();sync.key=$('#sy-key').value.trim();sync.code=$('#sy-code').value.trim();saveSync();
    if(sync.code&&sync.code.length<24){toast('Der Sync-Code muss mindestens 24 Zeichen haben.');return}
    doSync();render()},
  syncGen(){const b=new Uint8Array(24);crypto.getRandomValues(b);$('#sy-code').value=btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_')},
  syncLink(){if(!syncOn()){toast('Erst Verbindung speichern.');return}
    const link=location.origin+location.pathname+'#/set?cfg='+encodeURIComponent(btoa(JSON.stringify({u:sync.url,k:sync.key,c:sync.code})));
    (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('Geräte-Link kopiert – auf dem anderen Gerät öffnen ✔')).catch(()=>prompt('Geräte-Link kopieren:',link))},
  syncOff(){if(confirm('Synchronisation auf diesem Gerät trennen? Lokale Daten bleiben erhalten.')){sync={url:sync.url,key:sync.key,code:''};saveSync();setSyncState('off');render()}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||['INPUT','SELECT'].includes(el.tagName))return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('swin'))updateSwingStats()});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.a==='warmchk')A.warmchk(t);
  else if(t.dataset.a==='rdev'){const row=t.closest('.setrow');$('.r-w',row).innerHTML=loadSelect(t.value,loadFor(t.value,$('.r-lv',row).value));
    if(t.value!=='driver')$('.r-w',row).value=loadFor(t.value,$('.r-lv',row).value)}
  else if(t.classList.contains('r-lv')){const row=t.closest('.setrow'),dev=$('.r-dev',row).value;if(dev!=='driver')$('.r-w',row).value=loadFor(dev,t.value)}
  else if(t.dataset.set){setSetting(t.dataset.set,t.type==='checkbox'?t.checked:t.value)}
  else if(t.id==='impFile'&&t.files[0]){
    const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o.sessions)throw 0;
      if(!confirm(`Import ersetzt vorhandene Daten (${o.sessions.length} Einheiten). Fortfahren?`))return;
      S=mergeState(o);window.S=S;persist();applyTheme();render();toast('Import erfolgreich ✔')}catch(err){toast('Datei ungültig.')}};
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

load();applyCfgFromHash();applyTheme();checkBadges(true);persist();render();doSync();
</script>
