<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fit Lab">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#15130e">
<title>Fit Lab – Cardio & Kraft</title>
<style>
:root{
  --bg:#f4f1ea;--card:#ffffff;--card2:#f4f1ea;--text:#16130b;--muted:#5f5a4a;--line:#e6dfce;
  --accent:#ffc400;--ink:#15130e;--ok:#1a7a42;--warn:#8a5a00;--danger:#b3261e;--radius:20px;color-scheme:light;
  --c-tm:#15130e;--c-run:#ffc400;--c-bike:#b27000;--c-row:#2f5fd0;--c-hiit:#ffc400;--c-kraft:#15130e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:.01em;text-transform:uppercase}
h1{font-size:1.45rem}h2{font-size:1.05rem}h3{font-size:.92rem}
.muted{color:var(--muted)}.small{font-size:.875rem}.tiny{font-size:.78rem}.num{font-variant-numeric:tabular-nums}
a{color:inherit}

#app{min-height:100vh}
.topbar{background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;font-size:1.1rem}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-size:17px}
.brand b{color:var(--accent)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.64rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:#b9b29a;text-decoration:none;border-radius:12px}
#nav a .ic{font-size:1.2rem}
#nav a.on{color:var(--ink);background:var(--accent)}
#view{padding:16px 14px calc(var(--navh,84px) + 90px);max-width:760px;margin:0 auto}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead{flex-wrap:nowrap;align-items:center}
.pagehead h1{min-width:0}
.dtag{font-weight:800;font-size:.85rem;color:var(--muted);white-space:nowrap;text-align:right}
.pagehead input.dinput{flex:none;width:136px;min-width:0;font-weight:800;font-size:.85rem;padding:7px 8px;background:#fff;text-align:right}
.pagehead h1{flex:1}
input[type=date]{-webkit-appearance:none;appearance:none;min-height:36px}
input.dinput::-webkit-calendar-picker-indicator{margin-left:2px}
.subline{margin:-6px 0 12px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stack-v{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.card{background:var(--card);border-radius:var(--radius);padding:16px;min-width:0}
.card.dark{background:var(--ink);color:#fff;--text:#fff;--muted:#c4bda4;--line:#34301f;--card2:#2a2619}
.card.dark .big{color:var(--accent)}
.card.yellow{background:var(--accent);color:var(--ink);--muted:#4a3b00;--line:rgba(21,19,14,.2);--card2:rgba(255,255,255,.4)}
.card .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.big{font-size:2.3rem;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.big small{font-size:.95rem;font-weight:700;color:var(--muted);margin-left:4px}
.btn{border:2px solid var(--ink);background:transparent;border-radius:99px;padding:9px 18px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);text-transform:uppercase;letter-spacing:.04em;font-size:.85rem}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.dark{background:var(--ink);color:var(--accent)}
.btn.lg{padding:14px 24px;font-size:1rem}.btn.sm{padding:5px 12px;font-size:.74rem}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%;justify-content:center}
.btn:disabled{background:#d9d3c0;border-color:#d9d3c0;color:#8a846f;cursor:default}
.card.dark .btn{border-color:var(--accent);color:var(--accent)}
.card.dark .btn.primary{background:var(--accent);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:800;cursor:pointer;color:var(--muted);font-size:.92rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.chip.xl{font-size:1.25rem;padding:12px 20px;font-weight:900}
.chip.sm{padding:4px 11px;font-size:.8rem}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.76rem;font-weight:800;background:var(--card2);color:var(--muted)}
.pb{background:var(--accent);color:var(--ink);border-radius:6px;padding:1px 7px;font-size:.72rem;font-weight:900}
.bar{height:10px;border-radius:99px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.card.dark .bar{background:#34301f}
.hr{height:1px;background:var(--line);margin:12px 0}
.empty{padding:24px 10px;text-align:center;color:var(--muted)}
.field{display:grid;gap:4px}.field label{font-size:.74rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--card2);border:2px solid transparent;border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
.form2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stp .sr{display:flex;align-items:stretch}
.stp button{width:42px;border:0;background:var(--ink);color:var(--accent);font-weight:900;font-size:1.3rem;cursor:pointer}
.stp button:first-child{border-radius:12px 0 0 12px}.stp button:last-child{border-radius:0 12px 12px 0}
.stp input{border-radius:0;text-align:center;font-weight:900;font-size:1.15rem;padding:10px 2px;min-width:0;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hero-num{font-size:3.2rem;font-weight:900;line-height:1;letter-spacing:-.03em}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:2px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.t .r{text-align:right}
.note{border-left:4px solid var(--accent);padding:8px 12px;background:var(--card2);border-radius:0 12px 12px 0;font-size:.88rem}
.note.warn{border-color:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.sd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}

/* Kraft */
.ex{background:#fff;border-radius:16px;margin-bottom:8px;border:2px solid transparent}
.ex.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.exhead{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:12px 14px;cursor:pointer}
.chk{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:900;color:transparent}
.ex.on .chk{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.exn{font-weight:800}.exlast{font-size:.78rem;color:var(--muted)}
.exin{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;padding:2px 14px 14px}
details.grp{margin-bottom:14px}
details.grp>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:6px 4px 10px}
details.grp>summary::-webkit-details-marker{display:none}
.savebar{position:sticky;bottom:calc(var(--navh,84px) + 12px);z-index:20;margin-top:14px}
.lvl{display:flex;align-items:center;gap:12px}.lvl .ring{flex:none;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:1.5rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:10px}
.badge{background:#fff;border:2px solid var(--accent);border-radius:14px;padding:8px 6px;text-align:center;font-size:.7rem;font-weight:800;line-height:1.2}
.badge .bi{font-size:1.5rem;display:block}.badge.off{border-color:var(--line);opacity:.45;filter:grayscale(1)}
.dayhint{background:#fff7d6;border:2px dashed var(--accent);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.85rem}
.savebar .btn{box-shadow:0 8px 24px rgba(0,0,0,.25)}
/* Verlauf */
.hitem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:0}
.hic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-size:1.3rem}
.hic.k{background:var(--ink)}
.hbody{flex:1;min-width:0}
/* Charts */
.chartbox svg{width:100%;height:auto;display:block}
.axis text{fill:var(--muted);font-size:12px}
.gl{stroke:var(--line);stroke-width:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--card2);display:block;min-width:8px}
.heat i.l1{background:#ffe27a}.heat i.l2{background:var(--accent)}.heat i.l3{background:var(--ink)}
.heat i.today{outline:2px solid var(--text)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:60}
#modal.open{display:flex}
.sheet{background:#fff;border-radius:22px;padding:20px;width:min(640px,100%)}
#toasts{position:fixed;left:12px;right:12px;bottom:92px;display:grid;gap:8px;z-index:70;pointer-events:none;justify-items:center}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;animation:pop .3s;max-width:560px;pointer-events:auto}
.toast b{color:var(--accent)}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

@media (min-width:900px){
  #app{display:grid;grid-template-columns:230px 1fr}
  .topbar{display:none}
  #nav{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 12px;grid-column:1}
  #nav .brand{padding:4px 10px 18px;color:#fff}
  #nav a{flex:none;flex-direction:row;gap:12px;padding:11px 14px;font-size:.82rem}
  #nav a .ic{width:24px;text-align:center}
  #view{padding:26px 28px 60px;max-width:960px;margin:0;width:100%}
  .savebar{bottom:14px}
  #toasts{bottom:20px;left:auto;right:20px;justify-items:end}
}
@media (min-width:900px){.navfoot{display:block!important}}
.navfoot{display:none;margin-top:auto;padding:10px;font-size:.75rem;color:#b9b29a}
.brandnav{display:none}
@media (min-width:900px){.brandnav{display:flex}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar" id="topbar"></div>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="toasts"></div>

<script>
'use strict';
/* =========================================================
   Fit Lab – Cardio & Kraft (FitX)           Daten: localStorage + Supabase-Sync
   Einheiten (kind): hiit | z2 | kraft   (später erweiterbar: mobility, neuro …)
   ========================================================= */
const KEY='fitlab.v1', DRAFT_KEY='fitlab.draft', SYNC_KEY='fitlab.sync', UI_KEY='fitlab.ui';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return iso(d)};
const weekStart=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isNaN(x)?NaN:x};
const nf=(v,d=1)=>Number(v).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:d});
const DOW=['So','Mo','Di','Mi','Do','Fr','Sa'];
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const fmtDate=s=>{const d=parseD(s);return `${DOW[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]}`};
const fmtShort=s=>{const d=parseD(s);return `${d.getDate()}.${d.getMonth()+1}.`};
const ago=s=>{const n=daysBetween(s,today());return n<=0?'heute':n===1?'gestern':`vor ${n} Tg.`};
const isoWeek=s=>{const d=parseD(s);d.setDate(d.getDate()+3-((d.getDay()+6)%7));const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7)};
const narrow=()=>innerWidth<700;

/* ---------- Übungskatalog (FitX-Standardgeräte + Eigenes) ----------
   t: w = Sätze×Wdh×kg · t = Sätze×Sekunden · r = Wdh. gesamt (ein Satz)
   w = Startgewicht, s = Schrittweite, a = Assistenz (weniger = besser) */
const GRP=['Geräte','Seilzug','Hanteln','Turnen','Core'];
const MUSC=['Beine','Hüfte','Brust','Rücken','Schultern','Arme','Rumpf'];
const EX0=[
 {id:'beinpresse',n:'Beinpresse',g:'Geräte',m:'Beine',t:'w',w:80,s:5},
 {id:'beinstrecker',n:'Beinstrecker',g:'Geräte',m:'Beine',t:'w',w:80,s:5},
 {id:'beinbeuger',n:'Beinbeuger',g:'Geräte',m:'Beine',t:'w',w:80,s:5},
 {id:'adduktoren',n:'Adduktoren',g:'Geräte',m:'Hüfte',t:'w',w:80,s:5},
 {id:'abduktoren',n:'Abduktoren',g:'Geräte',m:'Hüfte',t:'w',w:80,s:5},
 {id:'wadenheben',n:'Wadenheben (Gerät)',g:'Geräte',m:'Beine',t:'w',w:80,s:5},
 {id:'butterfly',n:'Butterfly',g:'Geräte',m:'Brust',t:'w',w:45,s:2.5},
 {id:'reversebf',n:'Reverse Butterfly',g:'Geräte',m:'Schultern',t:'w',w:45,s:2.5},
 {id:'brustpresse',n:'Brustpresse',g:'Geräte',m:'Brust',t:'w',w:45,s:2.5},
 {id:'schulterpresse',n:'Schulterpresse',g:'Geräte',m:'Schultern',t:'w',w:45,s:2.5},
 {id:'latzug',n:'Latzug',g:'Geräte',m:'Rücken',t:'w',w:45,s:2.5},
 {id:'rudern',n:'Rudern (Gerät)',g:'Geräte',m:'Rücken',t:'w',w:45,s:2.5},
 {id:'pullup_sup',n:'Pull-Up (supported)',g:'Geräte',m:'Rücken',t:'w',w:20,s:2.5,a:1},
 {id:'bauch',n:'Bauchmuskeln (Gerät)',g:'Geräte',m:'Rumpf',t:'w',w:40,s:2.5},
 {id:'rueckenstr',n:'Rückenstrecker (Gerät)',g:'Geräte',m:'Rücken',t:'w',w:40,s:2.5},
 {id:'facepull',n:'Facepull',g:'Seilzug',m:'Schultern',t:'w',w:25,s:2.5},
 {id:'trizeps',n:'Trizeps (Seilzug)',g:'Seilzug',m:'Arme',t:'w',w:25,s:2.5},
 {id:'hippull',n:'Hip-Pull',g:'Seilzug',m:'Hüfte',t:'w',w:25,s:2.5},
 {id:'bizepscurl',n:'Bizeps-Curl',g:'Hanteln',m:'Arme',t:'w',w:10,s:1},
 {id:'singlelegsq',n:'Single Leg Squat',g:'Hanteln',m:'Beine',t:'w',w:10,s:1},
 {id:'squat',n:'Squat (Hantel)',g:'Hanteln',m:'Beine',t:'w',w:20,s:2},
 {id:'thruster',n:'Thruster (Kniebeuge → Überkopf)',g:'Hanteln',m:'Beine',t:'w',w:8,s:1},
 {id:'seitheben',n:'Seitheben',g:'Hanteln',m:'Schultern',t:'w',w:6,s:1},
 {id:'rueckenbank',n:'Rückenstrecker (Schrägbank)',g:'Turnen',m:'Rücken',t:'w',w:15,s:2.5},
 {id:'plank',n:'Plank',g:'Core',m:'Rumpf',t:'t'},
 {id:'sideplank',n:'Sideplank',g:'Core',m:'Rumpf',t:'t'},
 {id:'pullups',n:'Pull-ups',g:'Core',m:'Rücken',t:'r'}
];
const allEx=()=>[...EX0,...(S.settings.custom||[])];
const exById=id=>allEx().find(e=>e.id===id);
const exName=(id,fallback)=>exById(id)?.n||fallback||id;
const visibleEx=()=>allEx().filter(e=>!(S.settings.hidden||[]).includes(e.id));

const MODES={tm:{n:'Laufband',ic:'🏃',c:'var(--c-tm)',cc:'#15130e'},run:{n:'Outdoor-Lauf',ic:'🌳',c:'var(--c-run)',cc:'#ffc400'},bike:{n:'Indoor-Bike',ic:'🚴',c:'var(--c-bike)',cc:'#b27000'},row:{n:'Rudergerät',ic:'🚣',c:'var(--c-row)',cc:'#2f5fd0'}};
const MODE_KEYS=Object.keys(MODES);
const FORMATS=[[3,3],[3,4],[4,3],[4,4]];

/* ---------- Zustand ---------- */
const defaults=()=>({v:1,sessions:[],deleted:{},settingsMod:0,settings:{bw:79,goals:{hiit:1,z2:120,kraft:3},hidden:[],custom:[]}});
function mergeState(o){
  const d=defaults();o=o||{};
  return {...d,...o,sessions:o.sessions||[],deleted:o.deleted||{},settings:{...d.settings,...(o.settings||{}),goals:{...d.settings.goals,...((o.settings||{}).goals||{})}}};
}
let S=(()=>{try{return mergeState(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return defaults()}})();
window.S=S;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Speichern fehlgeschlagen – bitte Daten exportieren.')}scheduleSync()}
const touchSettings=()=>{S.settingsMod=Date.now()};
let ui={
  date:today(),
  hiit:{n:4,m:3,speed:'13.2',hf:'',note:''},
  z2:{mode:'tm',zone:2,min:'',km:'',hf:'',note:''},
  hfilter:'all',
  ana:{tab:'over',range:'W12',mode:'tm',ex:'',metric:'w'}
};
try{const u=JSON.parse(localStorage.getItem(UI_KEY)||'null');if(u){ui.hiit.n=u.n||4;ui.hiit.m=u.m||3;ui.z2.mode=u.mode||'tm';ui.z2.zone=u.zone||2;if(u.ana)ui.ana={...ui.ana,...u.ana}}}catch(e){}
function saveUi(){try{localStorage.setItem(UI_KEY,JSON.stringify({n:ui.hiit.n,m:ui.hiit.m,mode:ui.z2.mode,zone:ui.z2.zone,ana:ui.ana}))}catch(e){}}
function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v}

/* ---------- Abfragen ---------- */
const sortedAsc=()=>[...S.sessions].sort((a,b)=>a.date.localeCompare(b.date)||(a.created||0)-(b.created||0));
const sortedDesc=()=>sortedAsc().reverse();
const byKind=k=>sortedAsc().filter(s=>s.kind===k);
function lastItem(exId,before){
  for(const s of sortedDesc()){if(s.kind!=='kraft'||s===before)continue;const it=(s.items||[]).find(i=>i.ex===exId);if(it)return {...it,date:s.date}}
  return null;
}
function lastHiit(){return sortedDesc().find(s=>s.kind==='hiit')}
function lastZ2(mode){return sortedDesc().find(s=>s.kind==='z2'&&s.mode===mode)}
const speedOf=s=>s.min>0&&s.km>0?s.km/(s.min/60):NaN;
const paceStr=(minPerKm)=>{if(!isFinite(minPerKm))return '–';const t=Math.round(minPerKm*60);return `${Math.floor(t/60)}:${pad(t%60)}`};
function z2Metric(s){
  const sp=speedOf(s);if(!isFinite(sp))return '';
  if(s.mode==='row'){const sec=s.min*60/(s.km*2);return `Split ${Math.floor(sec/60)}:${pad(Math.round(sec%60))} /500 m`}
  if(s.mode==='bike')return `${nf(sp,1)} km/h`;
  return `${paceStr(s.min/s.km)} min/km · ${nf(sp,1)} km/h`;
}
function volOf(it){const ex=exById(it.ex);if(!ex)return 0;
  if(ex.t==='w'){const load=ex.a?Math.max(0,(S.settings.bw||79)-(it.w||0)):(it.w||0);return (it.sets||0)*(it.reps||0)*load}
  if(ex.t==='t')return (it.sets||0)*(it.sec||0);return it.reps||0}
const kraftVol=s=>(s.items||[]).filter(i=>exById(i.ex)?.t==='w').reduce((a,i)=>a+volOf(i),0);

/* Kennzahl je Übung (für Trends/Bestwerte). Assistenz: weniger = besser → in "score" negiert */
function exValue(ex,it,metric){
  if(ex.t==='t')return metric==='vol'?(it.sets||0)*(it.sec||0):it.sec||0;
  if(ex.t==='r')return it.reps||0;
  const load=ex.a?Math.max(0,(S.settings.bw||79)-(it.w||0)):(it.w||0);
  if(metric==='vol')return (it.sets||0)*(it.reps||0)*load;
  if(metric==='e1rm')return load*(1+(it.reps||0)/30);
  return it.w||0;
}
const better=(ex,a,b)=>ex.a?a<b:a>b;   // a besser als b?

/* ---------- Diagramme (SVG) ---------- */
function niceTicks(min,max,n=4){
  if(min===max){min-=1;max+=1}
  const step0=(max-min)/n,mag=10**Math.floor(Math.log10(step0)),f=step0/mag,step=(f<1.5?1:f<3?2:f<7?5:10)*mag;
  const lo=Math.floor(min/step+1e-9)*step,hi=Math.ceil(max/step-1e-9)*step,t=[];
  for(let v=lo;v<=hi+step/2;v+=step)t.push(+v.toFixed(6));return t;
}
function regress(pts){   // pts [{t(ms),v}] → Steigung pro Tag
  const n=pts.length;if(n<3)return null;
  const xs=pts.map(p=>p.t/864e5),mx=xs.reduce((a,b)=>a+b,0)/n,my=pts.reduce((a,p)=>a+p.v,0)/n;
  let sxy=0,sxx=0;pts.forEach((p,i)=>{sxy+=(xs[i]-mx)*(p.v-my);sxx+=(xs[i]-mx)**2});
  if(!sxx)return null;const b=sxy/sxx;return {b,a:my-b*mx};
}
function lineChart(pts,{fmt=v=>nf(v,1),color='#15130e',H=230}={}){
  if(!pts.length)return '<div class="empty">Noch keine Daten im Zeitraum.</div>';
  pts=[...pts].sort((a,b)=>a.t-b.t);
  const W=narrow()?420:720,m={l:46,r:16,t:16,b:28};
  let t0=pts[0].t,t1=pts[pts.length-1].t;if(t0===t1){t0-=864e5*3;t1+=864e5*3}
  const vs=pts.map(p=>p.v),ticks=niceTicks(Math.min(...vs),Math.max(...vs)),ymin=ticks[0],ymax=ticks[ticks.length-1];
  const X=t=>m.l+(t-t0)/(t1-t0)*(W-m.l-m.r),Y=v=>m.t+(1-(v-ymin)/(ymax-ymin||1))*(H-m.t-m.b);
  let g=ticks.map(v=>`<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('');
  for(let i=0;i<=3;i++){const t=t0+(t1-t0)*i/3,d=new Date(t);g+=`<text x="${X(t)}" y="${H-8}" text-anchor="${i===0?'start':i===3?'end':'middle'}">${d.getDate()}.${d.getMonth()+1}.</text>`}
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  const r=regress(pts);let tr='';
  if(r)tr=`<line x1="${X(t0)}" x2="${X(t1)}" y1="${Y(r.a+r.b*t0/864e5)}" y2="${Y(r.a+r.b*t1/864e5)}" stroke="${color}" stroke-width="2" stroke-dasharray="5 5" opacity=".45"/>`;
  const dots=pts.map((p,i)=>`<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===pts.length-1?6:4}" fill="${i===pts.length-1?'#ffc400':color}" stroke="${color}" stroke-width="2"><title>${esc(p.label||fmt(p.v))}</title></circle>`).join('');
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img"><g class="axis">${g}</g>${tr}<path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg></div>`;
}
function barChart(cats,{H=190,fmt=v=>nf(v,0),legend=[]}={}){
  if(!cats.length)return '<div class="empty">Noch keine Daten im Zeitraum.</div>';
  const W=narrow()?420:720,m={l:36,r:8,t:10,b:26};
  const max=Math.max(1,...cats.map(c=>c.stack.reduce((a,s)=>a+s.v,0))),ticks=niceTicks(0,max,4),ymax=ticks[ticks.length-1];
  const Y=v=>m.t+(1-v/ymax)*(H-m.t-m.b),bw=(W-m.l-m.r)/cats.length,k=Math.ceil(cats.length/(narrow()?6:12));
  let g=ticks.map(v=>`<line class="gl" x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('');
  const bars=cats.map((c,i)=>{let acc=0;const x=m.l+i*bw+bw*.15;
    const rects=c.stack.filter(s=>s.v>0).map(s=>{const y1=Y(acc+s.v),y0=Y(acc);acc+=s.v;return `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${Math.max(1,y0-y1).toFixed(1)}" rx="3" fill="${s.c}"><title>${esc(c.l)}: ${esc(s.name||'')} ${fmt(s.v)}</title></rect>`}).join('');
    return rects+(i%k===0?`<text x="${(x+bw*.35).toFixed(1)}" y="${H-8}" text-anchor="middle">${c.l}</text>`:'')}).join('');
  const lg=legend.length?`<div class="legend">${legend.map(([c,n])=>`<span><i class="sd" style="background:${c}"></i>${n}</span>`).join('')}</div>`:'';
  return `<div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img"><g class="axis">${g}</g>${bars}</svg></div>${lg}`;
}
function heatmap(weeks=20){
  const cnt={};S.sessions.forEach(s=>{(cnt[s.date]=cnt[s.date]||new Set()).add(s.kind)});Object.keys(cnt).forEach(k=>cnt[k]=cnt[k].size);
  const start=addDays(weekStart(today()),-(weeks-1)*7);let h='';
  for(let i=0;i<weeks*7;i++){const d=addDays(start,i);if(d>today()){h+='<i style="opacity:0"></i>';continue}
    const c=cnt[d]||0;h+=`<i class="${c>=3?'l3':c===2?'l3':c===1?'l2':''} ${d===today()?'today':''}" title="${d}: ${c}"></i>`}
  return `<div class="heat">${h}</div>`;
}
function rangeStart(r){return r==='W4'?addDays(today(),-28):r==='W12'?addDays(today(),-84):r==='Y'?addDays(today(),-365):'0000-00-00'}
function weeksList(from){
  const first=S.sessions.length?sortedAsc()[0].date:today();const f=weekStart(from>first?from:first);const out=[];
  for(let w=f;w<=weekStart(today());w=addDays(w,7))out.push(w);return out;
}

function sessLine(s){
  if(s.kind==='hiit')return {ic:'⚡',k:0,t:`HIIT ${s.n} × ${s.m} min`,d:`${nf(s.speed,1)} km/h${s.hf?` · HF-Peak ${s.hf}`:''}${s.note?` · ${esc(s.note)}`:''}`};

  const names=(s.items||[]).map(i=>exName(i.ex,i.n)).join(', ');
  return {ic:'🏋️',k:1,t:`Kraft · ${(s.items||[]).length} Übungen`,d:`${esc(names)}${kraftVol(s)?` · Volumen ${nf(kraftVol(s)/1000,1)} t`:''}`};
}
function weekStats(ws=weekStart(today())){
  const ss=S.sessions.filter(s=>weekStart(s.date)===ws);
  return {hiit:ss.filter(s=>s.kind==='hiit').length,kraft:ss.filter(s=>s.kind==='kraft').length,
    z2min:ss.filter(s=>s.kind==='z2').reduce((a,s)=>a+(s.min||0),0),n:new Set(ss.map(s=>s.date)).size};
}
function weekStreak(){
  let w=weekStart(today()),n=0;if(!weekStats(w).n)w=addDays(w,-7);
  while(weekStats(w).n){n++;w=addDays(w,-7)}return n;
}
function progRow(label,val,goal,unit=''){
  const p=goal?Math.min(100,val/goal*100):0;
  return `<div style="margin-top:12px"><div class="row sp"><b>${label}</b><span class="num">${nf(val,0)} / ${nf(goal,0)}${unit}${val>=goal&&goal?' ✓':''}</span></div><div class="bar" style="margin-top:6px"><i style="width:${p}%"></i></div></div>`;
}

/* ---------- Gamification: XP, Level, Abzeichen ---------- */
function xpOf(s){
  if(s.kind==='hiit')return 80+Math.round(Math.max(0,(s.speed||0)-10)*5);
  if(s.kind==='z2')return Math.round((s.min||0)*1.2);
  return 40+(s.items||[]).length*8;
}
const xpTotal=()=>S.sessions.reduce((a,s)=>a+xpOf(s),0)+20*new Set(S.sessions.map(s=>s.date)).size;
const RANKS=['Rookie','Starter','Regular','Athlet','Beast','Maschine','Legende'];
function levelInfo(xp){let lvl=1,rest=xp;const need=n=>100+40*n;while(rest>=need(lvl)){rest-=need(lvl);lvl++}
  return {lvl,rest,need:need(lvl),rank:RANKS[Math.min(RANKS.length-1,Math.floor((lvl-1)/2))]}}
function badgeList(){
  const ss=S.sessions,k=ss.filter(s=>s.kind==='kraft'),h=ss.filter(s=>s.kind==='hiit'),z=ss.filter(s=>s.kind==='z2');

  const maxW=id=>Math.max(0,...k.flatMap(s=>(s.items||[]).filter(i=>i.ex===id).map(i=>i.w||0)));
  const bestVol=Math.max(0,...k.map(kraftVol)),maxSpeed=Math.max(0,...h.map(x=>x.speed||0));
  const g=S.settings.goals,weeks=[...new Set(ss.map(s=>weekStart(s.date)))];
  const wk=weeks.filter(w=>{const t=weekStats(w);return t.hiit>=g.hiit&&t.z2min>=g.z2&&t.kraft>=g.kraft}).length;
  const longZ=Math.max(0,...z.map(x=>x.min||0)),st=weekStreak();
  return [
    {id:'d1',ic:'👟',n:'Erster Schritt',ok:d>=1},{id:'d10',ic:'🔟',n:'10 Trainingstage',ok:d>=10},
    {id:'d25',ic:'🥉',n:'25 Trainingstage',ok:d>=25},{id:'d50',ic:'🥈',n:'50 Trainingstage',ok:d>=50},{id:'d100',ic:'🥇',n:'100 Trainingstage',ok:d>=100},
    {id:'k10',ic:'🏋️',n:'10 Kraft-Tage',ok:k.length>=10},{id:'h10',ic:'⚡',n:'10 × HIIT',ok:h.length>=10},

    {id:'bp100',ic:'🦵',n:'Beinpresse 100 kg',ok:maxW('beinpresse')>=100},{id:'bp140',ic:'🦾',n:'Beinpresse 140 kg',ok:maxW('beinpresse')>=140},
    {id:'v10',ic:'🏗️',n:'10 t an einem Tag',ok:bestVol>=10000},{id:'v20',ic:'🚛',n:'20 t an einem Tag',ok:bestVol>=20000},
    {id:'w1',ic:'🎯',n:'Wochenziel erreicht',ok:wk>=1},{id:'w4',ic:'🔥',n:'4 Wochen Serie',ok:st>=4},{id:'w12',ic:'💎',n:'12 Wochen Serie',ok:st>=12}
  ];
}

function mergeKraftDays(){
  const by={};sortedAsc().filter(s=>s.kind==='kraft').forEach(s=>{(by[s.date]=by[s.date]||[]).push(s)});
  const order=allEx().map(e=>e.id);let ch=false;
  for(const d in by){const l=by[d];if(l.length<2)continue;const map=new Map();
    l.forEach(s=>(s.items||[]).forEach(i=>map.set(i.ex,i)));
    l[0].items=[...map.values()].sort((a,b)=>order.indexOf(a.ex)-order.indexOf(b.ex));l[0].mod=Date.now();
    l.slice(1).forEach(s=>{S.deleted[s.id]=Date.now()});ch=true}
  if(ch)S.sessions=S.sessions.filter(s=>!S.deleted[s.id]);
  return ch;
}

function anaKraft(r){
  const from=rangeStart(r),ks=byKind('kraft'),used=allEx().filter(e=>ks.some(s=>(s.items||[]).some(i=>i.ex===e.id)));

  const m=ui.ana.metric;
  const rows=ks.filter(s=>s.date>=from).flatMap(s=>(s.items||[]).filter(i=>i.ex===ex.id).map(i=>({s,i})));
  const unit=m==='w'?'kg':m==='e1rm'?'kg':m==='vol'?(ex.t==='t'?'s':'kg'):m==='sec'?'s':'Wdh.';

  const allPts=ks.flatMap(s=>(s.items||[]).filter(i=>i.ex===ex.id).map(i=>exValue(ex,i,m)));

const GKEY='fitlab.garmin', GCACHE='fitlab.garmin.cache', STRAP_FROM='2026-11-09'; // ab hier Brustgurt Garmin HR-200
let gcode='';try{gcode=localStorage.getItem(GKEY)||''}catch(e){}
let G=null;try{G=JSON.parse(localStorage.getItem(GCACHE)||'null')}catch(e){}
let gState={s:gcode?'idle':'off',msg:''},gBusy=false;
const gm=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
const gts=d=>parseD(d).getTime();
async function gRead(table,since){
  const r=await fetch(`${SYNC_DEFAULT.url}/rest/v1/rpc/garmin_read`,{method:'POST',headers:{apikey:SYNC_DEFAULT.key,'Content-Type':'application/json'},body:JSON.stringify({p_code:gcode,p_table:table,p_since:since})});
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.message)||('HTTP '+r.status));
  return Array.isArray(j)?j:[];
}
async function gSync(force){
  if(!gcode||gBusy)return;if(!force&&G&&Date.now()-G.t<4*36e5)return;
  gBusy=true;gState={s:'busy',msg:''};
  try{
    const since=addDays(today(),-400);
    const [daily,sleep,hrv,acts]=await Promise.all(['daily','sleep','hrv','activities'].map(t=>gRead(t,since)));
    if(!daily.length&&!sleep.length&&!hrv.length&&!acts.length)throw new Error('Keine Daten erhalten – Lesecode korrekt?');
    const by=(a,b)=>a.d<b.d?-1:1,TY=['treadmill_running','running','cycling','indoor_cycling'];
    G={t:Date.now(),
      daily:daily.map(x=>({d:x.date,rhr:x.resting_hr})).sort(by),
      sleep:sleep.map(x=>({d:x.date,sc:x.score,h:x.duration_s?x.duration_s/3600:null})).sort(by),
      hrv:hrv.map(x=>({d:x.date,v:x.last_night_avg})).sort(by),
      acts:acts.filter(x=>TY.includes(x.type)&&x.start_local).map(x=>({d:x.start_local.slice(0,10),ty:x.type,min:(x.duration_s||0)/60,km:(x.distance_m||0)/1000,hr:x.avg_hr,mx:x.max_hr,
        z:[1,2,3,4,5].map(i=>x['hr_zone_s_'+i]||0)})).sort(by)};
    try{localStorage.setItem(GCACHE,JSON.stringify(G))}catch(e){}
    gState={s:'ok',msg:''};
  }catch(e){gState={s:'err',msg:e.message}}
  gBusy=false;
  if(!$('#modal').classList.contains('open')&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))render();
}
function gStatusText(){
  if(!gcode)return 'Nicht verbunden.';

  return G?`✅ Garmin-Daten vom ${new Date(G.t).toLocaleString('de-DE',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})} (${G.acts.length} Läufe/Rides, ${G.hrv.length} HRV-Nächte, ${G.sleep.length} Schlaf-Nächte)`:'Noch keine Daten geladen.';
}

function formCard(){

  const lastH=hv[hv.length-1],lastR=dl[dl.length-1],lastS=sl[sl.length-1];
  const base=(arr,f,n=28)=>{const a=arr.slice(-n-1,-1).map(x=>x[f]);return a.length>=5?gm(a):NaN};
  const bH=base(hv,'v'),bR=base(dl,'rhr');

  if(lastR&&isFinite(bR)){if(lastR.rhr>=bR+4){pts--;why.push('Ruhepuls erhöht')}else if(lastR.rhr<=bR-3){pts++;why.push('Ruhepuls niedrig')}}

    <div class="tiny muted" style="margin-top:10px">${why.length?why.join(' · ')+' · ':''}Faustregel aus deinen eigenen Werten, keine medizinische Aussage.${old?` Letzte Garmin-Daten vom ${fmtShort(newest)}.`:''}</div></div>`;
}
function gcorr(p){p=p.filter(([x,y])=>isFinite(x)&&isFinite(y));if(p.length<8)return null;
  const mx=gm(p.map(a=>a[0])),my=gm(p.map(a=>a[1]));let sxy=0,sx=0,sy=0;p.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sx+=(x-mx)**2;sy+=(y-my)**2});
  return sx&&sy?{r:sxy/Math.sqrt(sx*sy),n:p.length}:null}
const gcTxt=(c,txt)=>c?`<div class="hitem"><div class="hbody"><b class="num">r = ${nf(c.r,2)}</b> <span class="muted small">(n = ${c.n})</span><div class="small">${txt}</div></div></div>`:`<div class="small muted" style="padding:6px 0">${txt}: noch zu wenig Daten.</div>`;

  const wk=(arr,f)=>{const m={};arr.filter(x=>x.d>=from&&isFinite(x[f])&&x[f]!=null).forEach(x=>{(m[weekStart(x.d)]=m[weekStart(x.d)]||[]).push(x[f])});return Object.keys(m).map(w=>({t:gts(w),v:gm(m[w]),label:`KW ${isoWeek(w)}: ${nf(gm(m[w]),1)}`}))};

  const rows=[['Datum','Typ','Name','Saetze','Wdh','Gewicht_kg','Sekunden','Intervalle','Minuten','Speed_kmh','Distanz_km','Zone','HF','Notiz']];
  sortedAsc().forEach(s=>{
    if(s.kind==='hiit')rows.push([s.date,'HIIT',`${s.n}x${s.m}`,'','','','',s.n,s.m,s.speed,'','',s.hf||'',s.note||'']);
    else if(s.kind==='z2')rows.push([s.date,'Zone2/3',MODES[s.mode]?.n||s.mode,'','','','','',s.min,speedOf(s).toFixed(2),s.km,s.zone,s.hf||'',s.note||'']);
    else (s.items||[]).forEach(i=>rows.push([s.date,'Kraft',exName(i.ex,i.n),i.sets??'',i.reps??'',i.w??'',i.sec??'','','','','','','','']));
  });

    [2,4].forEach(dd=>{const d=addDays(mon,dd);if(d>today()||Math.random()<.15)return;

async function rpc(fn,args){
  const h={'Content-Type':'application/json',apikey:sync.key};
  if(sync.key.startsWith('eyJ'))h.Authorization='Bearer '+sync.key;
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch(sync.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args),signal:ctl.signal});
    if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,140));
    const t=await r.text();return t?JSON.parse(t):null;
  }catch(e){throw e.name==='AbortError'?new Error('Zeitüberschreitung – Netzwerk prüfen'):e}
  finally{clearTimeout(to)}
}
const stable=o=>Array.isArray(o)?'['+o.map(stable).join(',')+']':o&&typeof o==='object'?'{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}':JSON.stringify(o);
const canon=o=>stable({s:[...(o.sessions||[])].sort((a,b)=>a.id<b.id?-1:1),st:o.settings,d:o.deleted||{},m:o.settingsMod||0});
function mergeData(a,b){
  if(!b||!b.sessions)return a;
  const del={};for(const o of [a.deleted,b.deleted])for(const k in (o||{}))del[k]=Math.max(del[k]||0,o[k]);
  const map=new Map();
  for(const s of [...b.sessions,...a.sessions]){const p=map.get(s.id);if(!p||(s.mod||0)>=(p.mod||0))map.set(s.id,s)}
  const sessions=[...map.values()].filter(s=>!(del[s.id]>(s.mod||0))).sort((x,y)=>x.date.localeCompare(y.date)||(x.created||0)-(y.created||0));
  const newer=(a.settingsMod||0)>=(b.settingsMod||0)?a:b;
  return {...a,settings:{...newer.settings},sessions,deleted:del,settingsMod:Math.max(a.settingsMod||0,b.settingsMod||0)};
}
function applyState(m){

async function doSync(force=false){
  if(!syncOn())return;
  if(syncing){syncAgain=true;return}
  syncing=true;setSyncState('busy');
  try{
    const local=JSON.parse(JSON.stringify(S));
    if(force){await rpc('fitlab_put',{p_code:sync.code,p_data:local})}
    else{
      const remote=await rpc('fitlab_get',{p_code:sync.code});
      const merged=mergeData(local,remote),mj=canon(merged);
      if(mj!==canon(local))applyState(merged);
      if(!remote||mj!==canon(remote))await rpc('fitlab_put',{p_code:sync.code,p_data:merged});
      syncState.remote=merged.sessions.length;
    }
    setSyncState('ok');
  }catch(e){setSyncState('err',e.message);clearTimeout(syncTimer);syncTimer=setTimeout(()=>doSync(),30000)}
  finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync()}}
}
function scheduleSync(){if(!syncOn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>doSync(),1500)}

}
